<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETF·BM 편출입 트래커</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#111827;--ink2:#374151;--muted:#6b7280;--line:#e5e7eb;--line2:#f0f1f3;--accent:#2457d6;--accent-bg:#eef3ff;
  --up:#d23f45;--up-bg:#fdeeee;--dn:#2b6cd9;--dn-bg:#e8f0fd;--warn:#b7791f;--warn-bg:#fdf3dc;--ok:#1f8a4c;--ok-bg:#e6f5ec;--zebra:#fafbfc}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
b,strong{font-weight:700}
/* header / nav */
.top{background:#fff;border-bottom:1px solid var(--line)}
.top .in{max-width:1320px;margin:0 auto;padding:14px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px}
.brand .tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-bg);padding:2px 8px;border-radius:999px;white-space:nowrap}
.nav-toggle{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font:inherit;font-size:12px;color:var(--ink2);cursor:pointer}
.meta{color:var(--muted);font-size:12px;padding-bottom:10px}
nav{max-width:1320px;margin:0 auto;padding:6px 12px 0;display:flex;gap:2px 18px;flex-wrap:wrap}
nav .grp{display:flex;align-items:center;gap:2px}
nav .grp .lbl{font-size:10.5px;font-weight:700;color:#9ca3af;letter-spacing:.06em;margin:0 6px 0 4px;text-transform:uppercase}
nav button{border:0;background:transparent;padding:9px 10px 10px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
.sticky{position:sticky;top:0;z-index:10;box-shadow:0 1px 0 var(--line)}
main{max-width:1320px;margin:0 auto;padding:18px 20px 40px}
section.tab{display:none}section.tab.on{display:block}
/* layout */
.grid{display:grid;gap:16px;min-width:0}.grid>*{min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.stack>*+*{margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0;box-shadow:0 2px 6px #162a4803}
.card.tight{padding:12px 14px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;color:#9ca3af;text-transform:uppercase;margin:0 0 4px}
.card h2{margin:0 0 4px;font-size:16px;font-weight:800;letter-spacing:-.2px}
.card h3{margin:14px 0 8px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.hd .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* kpi */
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12px;margin-top:4px}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:6px}
/* badges */
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;background:#eef0f3;color:#374151;white-space:nowrap;line-height:1.6}
.badge.up{background:var(--up-bg);color:var(--up)}.badge.dn{background:var(--dn-bg);color:var(--dn)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.acc{background:var(--accent-bg);color:var(--accent)}
.badge.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px 6px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;vertical-align:middle}
th{position:sticky;top:0;background:#f8f9fb;color:#6b7280;font-weight:600;font-size:11.5px;letter-spacing:.01em;z-index:1}
td:first-child,th:first-child,.l{text-align:left}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr:hover td{background:#f1f5fd}
tbody tr.click{cursor:pointer}
td .code{color:#9ca3af;font-size:11px;margin-left:4px}
td.wrap,th.wrap{white-space:normal}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:72vh;overscroll-behavior-inline:contain;scrollbar-width:thin;scrollbar-color:#c8d1df transparent}
.tbl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sort-button{display:inline-flex;align-items:center;justify-content:flex-end;gap:7px;min-height:24px;padding:0;border:0;background:transparent;font:inherit;color:inherit;cursor:pointer;text-align:inherit;white-space:inherit}
th.l .sort-button,th:first-child .sort-button{justify-content:flex-start}
.sort-button:hover{color:var(--accent)}.sort-button:focus-visible,.stock-link:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.sort-arrow{color:#a3adbc;font-size:12px}th[aria-sort=ascending],th[aria-sort=descending]{background:#edf3ff;color:var(--accent)}th[aria-sort=ascending] .sort-arrow,th[aria-sort=descending] .sort-arrow{color:var(--accent)}
.stock-link{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--ink2);cursor:pointer;text-align:left}.stock-link:hover{color:var(--accent);text-decoration:underline}
.quality{margin-bottom:16px;padding:10px 14px;display:flex;gap:7px 14px;align-items:center;flex-wrap:wrap;font-size:12px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;color:var(--muted)}
.quality.warning{background:#fffbef;border-color:#ecdbae;color:#79591d}.quality details{flex-basis:100%}.quality summary{cursor:pointer}.quality ul{margin:6px 0;padding-left:20px}
.change-card{margin:16px 0;border-top:3px solid var(--accent)}.change-summary{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.change-summary .badge{padding:4px 10px}.change-empty{margin:8px 0 0;color:var(--muted);font-size:13px}
.sort-help{margin:6px 0 12px;color:var(--muted);font-size:11.5px}.tab{scroll-margin-top:140px}#flow-detail,#hist-detail,#etf-detail{scroll-margin-top:150px}
.tbl.short{max-height:400px}.tbl.xs{max-height:260px}
.pos{color:var(--up)}.neg{color:var(--dn)}.muted{color:var(--muted)}.small{font-size:12px}.xs{font-size:11px}
/* controls */
input[type=text],input[type=number],select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:var(--ink)}
input[type=text]:focus,input[type=number]:focus,select:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:disabled{cursor:not-allowed;color:#9ca3af;background:#f7f8fa}.seg button.on{background:var(--accent);color:#fff}
.toggle{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
/* notes */
details.note{background:#f8f9fb;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--ink2);margin:10px 0 0}
details.note summary{cursor:pointer;font-weight:600;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px}
details.note summary::-webkit-details-marker{display:none}
details.note summary::before{content:"▸";font-size:11px;transition:transform .15s}
details.note[open] summary::before{transform:rotate(90deg)}
details.note .body{margin-top:8px;line-height:1.6}
details.note ul{margin:4px 0 0 18px;padding:0}
.callout{border-left:3px solid var(--accent);background:var(--accent-bg);padding:8px 12px;border-radius:6px;font-size:12.5px;color:var(--ink2)}
/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:82px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.tl li:last-child{border-bottom:0}
.tl .d{font-weight:700;font-size:13px}.tl .dd{font-size:11.5px;color:var(--accent);font-weight:700}
.tl .i{font-weight:700;font-size:13px}.tl .e{color:var(--ink2);font-size:12.5px}.tl .s{color:var(--muted);font-size:11.5px;margin-top:2px}
.tl li.soon .dd{color:var(--up)}
/* kb */
.kb{margin:0}.kb dt{font-weight:700;margin-top:10px;font-size:12.5px;color:var(--ink2)}.kb dd{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
.kb ul{margin:2px 0 0 18px;padding:0}
/* misc */
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:12.5px;align-items:center}
.list li:last-child{border-bottom:0}
.list .n{font-weight:600}.list .m{color:var(--muted);font-size:11.5px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:26px 16px}
@media (max-width:760px){main{padding:12px}.card{padding:15px}.g2{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-kpis>.kpi:first-child{grid-column:1/-1}.kpi .v{font-size:20px}.kpi .s,.kpi .l{font-size:11.5px}.brand h1{font-size:16px}.brand .tag{display:none}.top .in{padding:10px 12px;gap:6px}.nav-toggle{display:block}.meta{order:3;flex-basis:100%;font-size:10.5px;padding:0}.top nav{display:none;padding:5px 8px 10px;max-height:55vh;overflow:auto;gap:4px}.top nav.open{display:grid;grid-template-columns:1fr 1fr}.top nav .grp{align-items:stretch;flex-direction:column;min-width:0}.top nav .grp .lbl{margin:7px 8px 2px}.top nav button{font-size:12px;padding:8px;text-align:left;border:0;border-radius:7px;white-space:normal}.top nav button.on{background:var(--accent-bg)}th,td{padding:8px}.tbl table{font-size:12px}.tbl table.freeze-first td:first-child{position:sticky;left:0;background:var(--card);z-index:1;box-shadow:1px 0 0 var(--line);max-width:160px;white-space:normal;min-width:110px}.tbl table.freeze-first th:first-child{left:0;z-index:3;box-shadow:1px 0 0 var(--line)}.tbl table.freeze-first tbody tr:nth-child(even) td:first-child{background:var(--zebra)}td .code{display:block;margin-left:0}.hd .r{width:100%}.hd .r input[type=text]{min-width:0;flex:1}.seg{max-width:100%;overflow:auto;flex-shrink:0}.seg button{white-space:nowrap}input[type=text]{max-width:100%}.quality{font-size:11.5px}.tab,#flow-detail,#hist-detail,#etf-detail{scroll-margin-top:110px}}
</style>
</head>
<body>
<div class="top sticky">
  <div class="in">
    <div class="brand"><h1>ETF·BM 편출입 트래커</h1><span class="tag">공식 방법론 기준</span></div>
    <button class="nav-toggle" id="nav-toggle" aria-controls="nav" aria-expanded="false">메뉴 · 대시보드</button>
    <div class="meta" id="hdr-sub"></div>
  </div>
  <nav id="nav">
    <div class="grp"><span class="lbl">개요</span><button data-t="dash" class="on">대시보드</button><button data-t="cal">일정</button></div>
    <div class="grp"><span class="lbl">플로우</span><button data-t="flows">전체 리밸 플로우</button><button data-t="hist">히스토리</button></div>
    <div class="grp"><span class="lbl">예측</span><button data-t="k200">코스피 200</button><button data-t="kq150">코스닥 150</button><button data-t="top">KOSPI100·TOP·테마</button></div>
    <div class="grp"><span class="lbl">모니터</span><button data-t="adhoc">수시·특례·MSCI</button></div>
    <div class="grp"><span class="lbl">자료</span><button data-t="etf">ETF·방법론</button><button data-t="search">종목 검색</button></div>
  </nav>
</div>
<main>
  <div id="data-quality"></div>
  <p class="sort-help">표의 열 제목을 클릭하면 오름차순 ↑ · 내림차순 ↓으로 정렬됩니다. 종목명을 누르면 상세를 확인할 수 있습니다.</p>
  <section class="tab on" id="tab-dash"></section>
  <section class="tab" id="tab-cal"></section>
  <section class="tab" id="tab-hist"></section>
  <section class="tab" id="tab-flows"></section>
  <section class="tab" id="tab-k200"></section>
  <section class="tab" id="tab-kq150"></section>
  <section class="tab" id="tab-top"></section>
  <section class="tab" id="tab-adhoc"></section>
  <section class="tab" id="tab-etf"></section>
  <section class="tab" id="tab-search"></section>
</main>
<footer>데이터: 네이버금융·다음금융·WISE(섹터)·wisereport(ETF PDF) 공개 데이터 · 방법론: KRX·FnGuide·MSCI 공식 문서 · 투자판단 참고자료이며 정확성을 보장하지 않습니다.</footer>
<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const A = D.analysis, KB = D.kb.indexes, EIK = D.kb.etf_index_key;
const $ = s => document.querySelector(s);
const fmt = {
  eok(v){ if(v==null) return '-'; return fmt.eokv(v/1e8); },
  eokv(e){ if(e==null||isNaN(e)) return '-'; const a=Math.abs(e), sgn=e<0?'-':''; if(a>=10000) return sgn+(a/10000).toFixed(a>=100000?0:1)+'조'; return sgn+Math.round(a).toLocaleString()+'억'; },
  signed(e){ if(e==null) return '-'; return (e>0?'+':'')+fmt.eokv(e); },
  pct(v,d=1){ return v==null?'-':(v*100).toFixed(d)+'%'; },
  n(v,d=0){ return v==null?'-':Number(v).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d}); },
  date(s){ if(!s) return '-'; s=String(s); return s.length===8? `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6)}`: s; },
  md(s){ return s? String(s).slice(5,10).replace('-','/') : '-'; },
};
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls = v => v>0?'pos':v<0?'neg':'';
const statusBadge = s => { if(!s) return ''; const t=esc(s); if(s.startsWith('신규편입')) return `<span class="badge up">${t}</span>`; if(s.startsWith('편출')) return `<span class="badge dn">${t}</span>`; if(s.startsWith('유지')) return `<span class="badge ok">${t}</span>`; if(s.startsWith('산업군제외')||s.startsWith('심사제외')) return `<span class="badge warn">${t}</span>`; return `<span class="badge">${t}</span>`; };
const stockLink = (name, code) => code?`<button class="stock-link" data-stock="${esc(code)}" title="${esc(name)} 종목 상세">${esc(name)}</button>`:esc(name);
const nm = (name, code) => `${stockLink(name,code)}<a class="code" href="https://finance.naver.com/item/main.naver?code=${esc(code)}" target="_blank" rel="noopener" aria-label="${esc(name)} 네이버금융 새 창">${esc(code)}</a>${priceInfo(A.stock_data?.[code])}`;
const note = (title, html) => `<details class="note"><summary>${esc(title)}</summary><div class="body">${html}</div></details>`;
const sortAttr = value => `data-sort="${value==null||typeof value==='number'&&!Number.isFinite(value)?'':esc(value)}"`;

/* SORT_HELPERS_START: shared pure helpers, also exercised by the regression test. */
function parseSortValue(value){
  if(value==null) return null;
  if(typeof value==='number') return Number.isFinite(value)?value:null;
  const text=String(value).trim().replace(/\u2212/g,'-');
  if(!text||/^(?:-|—|–|N\/A|null|undefined|PDF 대기)$/i.test(text)) return null;
  const clean=text.replace(/,/g,'').replace(/\s+/g,'');
  if(/^\d{4}-\d{2}-\d{2}(?:$|[^\d])/.test(text)) return Date.parse(text.slice(0,10));
  if(/^\d{8}$/.test(clean)&&Number(clean.slice(0,4))>=1900&&Number(clean.slice(0,4))<2200) return Date.parse(`${clean.slice(0,4)}-${clean.slice(4,6)}-${clean.slice(6,8)}`);
  if(/^D[-+]\d+$/i.test(clean)) return Number(clean.slice(2))*(clean[1]==='+'?-1:1);
  if(/^[+-]?(?:\d+(?:\.\d+)?조)?(?:\d+(?:\.\d+)?억)?$/.test(clean)&&/[조억]/.test(clean)){
    const sign=clean[0]==='-'?-1:1, jo=clean.match(/([\d.]+)조/), eok=clean.match(/([\d.]+)억/);
    return sign*((jo?Number(jo[1])*1e12:0)+(eok?Number(eok[1])*1e8:0));
  }
  if(/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:%p?|일|위|배|개|종목)?\*?$/.test(clean)) return parseFloat(clean);
  return text;
}
function compareSortValues(left,right,direction='asc'){
  const a=parseSortValue(left), b=parseSortValue(right);
  if(a===null||b===null) return a===b?0:a===null?1:-1;
  const order=typeof a==='number'&&typeof b==='number'?a-b:String(a).localeCompare(String(b),'ko',{numeric:true,sensitivity:'base'});
  return direction==='desc'?-order:order;
}
function stableSortEntries(entries,direction='asc'){
  return [...entries].sort((a,b)=>compareSortValues(a.value,b.value,direction)||a.order-b.order);
}
/* SORT_HELPERS_END */

const tableSortState=new Map();
let tableObserver;
function tableIdentity(table){
  const owner=table.parentElement.closest('[id]');
  const position=owner?Array.from(owner.querySelectorAll('table')).indexOf(table):0;
  return `${owner?.id||'table'}:${position}`;
}
function cellSortValue(cell){
  if(!cell) return null;
  if(cell.hasAttribute('data-sort')) return cell.dataset.sort!==''&&Number.isFinite(Number(cell.dataset.sort))?Number(cell.dataset.sort):cell.dataset.sort;
  const stock=cell.querySelector('[data-stock]');
  return stock?stock.textContent:cell.textContent;
}
function applyTableSort(table,state){
  const heads=Array.from(table.tHead?.rows[0]?.cells||[]);
  const index=heads.findIndex(th=>th.dataset.label===state.label);
  if(index<0) return;
  const body=table.tBodies[0]; if(!body) return;
  const entries=Array.from(body.rows).filter(row=>row.cells.length===heads.length).map((row,i)=>({row,value:cellSortValue(row.cells[index]),order:Number(row.dataset.originalOrder??i)}));
  const sorted=stableSortEntries(entries,state.direction);
  const fragment=document.createDocumentFragment(); sorted.forEach(x=>fragment.appendChild(x.row)); body.appendChild(fragment);
  heads.forEach((th,i)=>{
    const active=i===index, next=active&&state.direction==='asc'?'내림차순':'오름차순';
    th.setAttribute('aria-sort',active?(state.direction==='asc'?'ascending':'descending'):'none');
    const button=th.querySelector('.sort-button');
    if(button){button.title=`${th.dataset.label} · ${next} 정렬`;button.setAttribute('aria-label',button.title);button.querySelector('.sort-arrow').textContent=active?(state.direction==='asc'?'↑':'↓'):'↕';}
  });
}
function enhanceTables(){
  tableObserver?.disconnect();
  document.querySelectorAll('main .tbl table').forEach(table=>{
    if(table.dataset.sortReady) return;
    table.dataset.sortReady='true';
    const heads=Array.from(table.tHead?.rows[0]?.cells||[]); if(!heads.length) return;
    table.dataset.sortId=tableIdentity(table);
    if(['종목','ETF','추종 ETF','지수','산업군'].includes(heads[0].textContent.trim())) table.classList.add('freeze-first');
    const wrapper=table.closest('.tbl'); wrapper.tabIndex=0;wrapper.setAttribute('role','region');wrapper.setAttribute('aria-label','정렬 가능한 표. 가로로 스크롤하여 전체 열 확인');
    Array.from(table.tBodies[0]?.rows||[]).forEach((row,i)=>row.dataset.originalOrder=i);
    heads.forEach(th=>{
      th.scope='col'; th.dataset.label=th.textContent.trim();

function flowModel(idx, aumEok){
  if((idx.excluded_current||[]).some(u=>A.stock_data?.[u.code]?.review_ready===false)) return null;
  const sel = idx.all.filter(u => u.status && (u.status.startsWith('유지')||u.status.startsWith('신규편입')));
  const fifs = idx.all.filter(u=>u.is_cur && u.fif).map(u=>u.fif).sort((a,b)=>a-b);
  const fifDef = fifs.length? fifs[Math.floor(fifs.length/2)] : 0.6;
  const w = u => (u.mktcap_now||0) * (u.fif || fifDef);
  const tot = sel.reduce((s,u)=>s+w(u),0);
  const wDel = u => (u.cur_weight && u.cur_weight>0)? u.cur_weight/100 : w(u)/tot;
  return { weight:u=> w(u)/tot, weightDel:wDel, flowAdd:u=> aumEok*(w(u)/tot), flowDel:u=> aumEok*wDel(u), advDays:(f,u)=> u.avg_trdval? (f*1e8)/u.avg_trdval : null };
}

  const show=(id, scroll)=>{

      <div class="callout" id="hist-desc"></div>
      <div id="hist-sum" style="margin-top:12px"></div>
      ${note('보관·대조 방법', `<b>보관</b>: 매매일 아침 갱신 결과(직전 영업일 PDF = 매매 전 포트폴리오)를 파일로 동결하고 이후 갱신에서 덮어쓰지 않습니다. <b>실제</b>: 매매 후 프록시 ETF PDF와 스냅샷 PDF의 비중 차이(직전 PDF는 새 PDF 기준일 종가로 드리프트 보정) × 총 추종명목. 지수 실제 비중이 아니라 ETF 실물 PDF 기준이므로 현금·선물·추적오차만큼 차이가 납니다. <b>방향 일치</b>: 예측 또는 실제 Δ가 0.05%p 이상인 종목 중 부호가 같은 비율. <b>규칙</b>: ${esc(h.rules||'')}`)}
      <div class="tbl" id="hist-tbl" style="margin-top:12px"></div></div>`;
    const draw=()=>{

      const codes=new Set(sc.rows.map(r=>r.code)); const extra=a?Object.entries(a.rows).filter(([c])=>!codes.has(c)).map(([c,v])=>({code:c,name:v.name,status:'예측 밖',w_cur:v.w_old,w_target:null,delta:null,flow_total:null,adv_mult:null})):[];
      const rows=[...sc.rows,...extra].sort((x,y)=>Math.abs((a?(a.rows[y.code]||{}).flow:y.flow_total)||0)-Math.abs((a?(a.rows[x.code]||{}).flow:x.flow_total)||0));
      $('#hist-tbl').innerHTML=`<table><thead><tr><th class="l">종목</th><th class="l">예측</th><th data-no-sort>현재→목표</th><th>Δ 예측</th><th>순매매 예측</th><th>ADV</th>${a?'<th class="l">실제</th><th data-no-sort>PDF 전→후</th><th>Δ 실제</th><th>실제 매매</th><th>오차</th>':''}</tr></thead><tbody>${rows.map(r=>{const ar=a&&a.rows[r.code]; const act=ar?(ar.w_old===0?'신규편입':ar.w_new===0?'편출':'유지'):null; const err=(ar&&r.flow_total!=null)?ar.flow-r.flow_total:null;

    };
    document.querySelectorAll('#hist-sc button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#hist-sc button').forEach(x=>x.classList.toggle('on',x===b));cur=b.dataset.v;draw();});

function wdesc(w){ if(!w) return '-'; if(w.type==='float') return `유동시총 가중${w.cap?` · ${Math.round(w.cap*100)}% 실링`:''}`; if(w.type==='topn_fixed') return `상위 ${w.n}종목 각 ${Math.round(w.w*100)}% 고정 + 나머지 ${{float:'유동시총 가중',equal:'균등',current:'현재비중 비례'}[w.rest]||w.rest}${w.cap?` (${Math.round(w.cap*100)}% 실링)`:''}`; if(w.type==='score_tiered') return `스코어 가중 · 1위 ${Math.round(w.first*100)}% / 그외 ${Math.round(w.others*100)}% 실링`; return JSON.stringify(w); }

    ${note('계산 방법·가정', `각 지수의 <b>공식 가중·캡 규칙</b>으로 목표비중을 만들고, 프록시 ETF PDF 비중(최근 종가로 드리프트 보정)과의 차이에 추종 ETF 명목(레버리지는 2배에서 기초ETF 실물 보유분 중복 차감)을 곱했습니다. 종목 선정 로직을 재현할 수 있는 지수(KOSPI200·KOSDAQ150·KOSPI100·코스피200 IT·FnGuide TOP10·반도체TOP10)는 편출입 예측을 반영했고, 키워드/스코어 선정 지수는 <b>구성종목 불변 가정</b>으로 비중·캡 재설정 효과만 계산했습니다. 유지 종목의 소액 Δ는 유동비율 추정 오차가 섞여 있으니 편입·편출과 캡 재설정에 의한 큰 금액 위주로 보세요.`)}
  </div>

function krxTable(rows, fm, isAdd){
  const flowCol = fm? `<th>예상비중</th><th>패시브 ${isAdd?'매수':'매도'}</th><th>ADV</th>`:'';
  const confCol = fm? `<th class="l">확신도</th>`:'';
  const confBadge = u => u.confidence? `<span class="badge ${u.confidence==='高'?'ok':u.confidence==='中'?'acc':'warn'}" title="${esc(u.conf_note||'')}">${u.confidence}</span>${u.risk?` <span class="badge warn" title="심사기간 수익률 ${fmt.pct(u.ret_period,0)}">급등</span>`:''}<div class="muted xs">${esc(u.conf_note||'')}</div>` : '';
  return `<table><thead><tr><th class="l">종목</th><th class="l">산업군</th><th>일평균시총</th><th>거래대금</th><th>순위/기존</th><th>순위비율</th><th>누적</th><th>유동성</th><th class="l">상태</th>${confCol}${flowCol}<th>현비중</th></tr></thead><tbody>${rows.map(u=>{
    let fc='';
    if(fm){ const flow = isAdd? fm.flowAdd(u) : fm.flowDel(u); const w = isAdd? fm.weight(u) : fm.weightDel(u); const adv = fm.advDays(flow,u); fc=`<td class="l" ${sortAttr(({"低":1,"中":2,"高":3})[u.confidence])}>${confBadge(u)}</td><td ${sortAttr(w)}>${fmt.pct(w,2)}</td><td class="${isAdd?'pos':'neg'}" ${sortAttr(flow)}><b>${fmt.eokv(flow)}</b></td><td ${sortAttr(adv)}>${adv==null?'-':adv.toFixed(1)+'일'}</td>`; }
    return `<tr><td class="l">${nm(u.name,u.code)}</td><td class="l">${esc(u.sector||'')}${u.sector_src==='KRX GICS'?'':u.sector_src==='WICS'?'<span class="code">WICS</span>':u.sector_src?'<span class="code">'+esc(u.sector_src)+'</span>':''}</td><td ${sortAttr(u.avg_mcap)}>${fmt.eok(u.avg_mcap)}</td><td ${sortAttr(u.avg_trdval)}>${fmt.eok(u.avg_trdval)}</td><td ${sortAttr(u.mcap_rank)}>${u.mcap_rank??'-'}/${u.n_exist??'-'}</td><td class="${u.rank_ratio>1?'neg':''}" ${sortAttr(u.rank_ratio)}>${fmt.pct(u.rank_ratio,0)}</td><td ${sortAttr(u.cum_share)}>${fmt.pct(u.cum_share,1)}</td><td ${sortAttr(u.liq_ok===false?0:u.liq_ok?1:null)}>${u.liq_ok===false?'<span class="badge dn">미달</span>':u.liq_ok?'<span class="badge ok">충족</span>':'-'}</td><td class="l" ${sortAttr(u.status)}>${statusBadge(u.status)}${u.risk&&!fm?` <span class="badge warn">급등</span>`:''}${u.note?`<div class="muted xs">${esc(u.note)}</div>`:''}</td>${fc}<td ${sortAttr(u.cur_weight)}>${u.cur_weight!=null?u.cur_weight+'%':'-'}</td></tr>`;}).join('')}</tbody></table>`;
}

/* ---------- ETF·BM 방법론 ---------- */
function renderEtf(){
  const wrap=$('#tab-etf');
  wrap.innerHTML = `<div class="card"><div class="hd"><div><div class="eyebrow">자료</div><h2>순자산 상위 ETF ${D.etfs.length}개 · 기초지수 · 방법론</h2><p class="sub">행을 클릭하면 공식 방법론 요약과 원문 링크</p></div>
    <div class="r"><input type="text" id="etf-q" placeholder="ETF·지수·산출기관"><select id="etf-p"><option value="">전체 산출기관</option>${[...new Set(D.etfs.map(e=>e.provider))].map(p=>`<option>${esc(p)}</option>`).join('')}</select><label class="toggle"><input type="checkbox" id="etf-dom"> 분석 대상 지수만</label></div></div>
    <div class="tbl" id="etf-tbl"></div></div><div id="etf-detail" style="margin-top:14px"></div>`;
  const draw=()=>{
    const q=($('#etf-q').value||'').toLowerCase(), p=$('#etf-p').value, dom=$('#etf-dom').checked;
    const rows=D.etfs.filter(e=>(!q||(e.name+e.bm+e.provider).toLowerCase().includes(q))&&(!p||e.provider===p)&&(!dom||EIK[e.bm])).sort((a,b)=>(b.aum_eok||0)-(a.aum_eok||0));
    $('#etf-tbl').innerHTML=`<table><thead><tr><th class="l">ETF</th><th>순자산</th><th class="l">기초지수</th><th class="l">산출기관</th><th class="l" data-no-sort>정기변경</th><th class="l" data-no-sort>캡</th><th>신뢰도</th></tr></thead><tbody>${rows.map(e=>`<tr class="click" data-c="${e.code}"><td class="l"><b>${esc(e.name)}</b><span class="code">${e.code}</span></td><td ${sortAttr(e.aum_eok)}>${fmt.eokv(e.aum_eok)}</td><td class="l wrap">${esc(e.bm)}${EIK[e.bm]?' <span class="badge acc">분석</span>':''}</td><td class="l">${esc(e.provider)}</td><td class="l wrap" style="max-width:280px">${esc(e.cycle)}<div class="muted xs">${esc(e.apply_rule)}</div></td><td class="l wrap" style="max-width:200px">${esc(e.cap)}</td><td>${esc(e.confidence)}</td></tr>`).join('')}</tbody></table>`;
    document.querySelectorAll('#etf-tbl tr[data-c]').forEach(tr=>tr.onclick=()=>showEtf(tr.dataset.c));
  };
  $('#etf-q').oninput=draw; $('#etf-p').onchange=draw; $('#etf-dom').onchange=draw; draw();
}
function showEtf(code){
  const e=D.etfs.find(x=>x.code===code); const key=EIK[e.bm]; const kb=key?KB[key]:null;
  const members = key&&D.members[key]? D.members[key].length : null;
  $('#etf-detail').innerHTML = `<div class="card"><div class="eyebrow">상세</div><h2>${esc(e.name)} <span class="muted" style="font-weight:500;font-size:13px">${e.code} · 순자산 ${fmt.eokv(e.aum_eok)} · NAV ${fmt.n(e.nav)}</span></h2>
    <div class="grid g2"><div><dl class="kb"><dt>기초지수</dt><dd>${esc(e.bm)} (${esc(e.provider)})</dd><dt>정기변경</dt><dd>${esc(e.cycle)} — ${esc(e.apply_rule)}</dd><dt>캡</dt><dd>${esc(e.cap)} / ${esc(e.cap_type)}</dd><dt>캡 점검·수시</dt><dd>${esc(e.cap_check)}</dd><dt>정보 신뢰도</dt><dd>${esc(e.confidence)}</dd></dl></div>
    <div>${kb?`<dl class="kb"><dt>공식 방법론 — ${esc(kb.name)}</dt><dd class="muted xs">${esc(kb.doc)} ${kb.doc_url?`· <a href="${kb.doc_url}" target="_blank" rel="noopener">원문 →</a>`:''}</dd><dt>유니버스</dt><dd>${esc(kb.universe)}</dd>${kb.sector?`<dt>산업군</dt><dd>${esc(kb.sector)}</dd>`:''}${kb.criteria?`<dt>심사기준/선정일</dt><dd>${esc(kb.criteria)}</dd>`:''}<dt>선정</dt><dd><ul>${(kb.selection||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></dd><dt>정기변경</dt><dd>${esc(kb.regular)}</dd><dt>수시변경</dt><dd><ul>${(kb.adhoc||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></dd><dt>가중/캡</dt><dd>${esc(kb.cap)}</dd>${kb.notes?`<dt>비고</dt><dd>${esc(kb.notes)}</dd>`:''}</dl>${members?`<p class="muted xs">프록시 ETF 구성종목 ${members}개 (${D.proxy[key]?.date})</p>`:''}`:'<div class="callout">이 지수는 아직 정량 분석 대상이 아닙니다(해외지수·소규모 산출기관). 왼쪽 마스터 정보(투자설명서·방법론 조사)를 참고하세요.</div>'}</div></div>
  </div>`;
  $('#etf-detail').scrollIntoView({behavior:'smooth',block:'start'});
}

const PROXY_LABEL = {kospi200:'KOSPI 200',kosdaq150:'KOSDAQ 150',kospi100:'KOSPI 100',kospi:'코스피(전종목)',kospi200_it:'코스피200 정보기술',fn_top10:'FnGuide TOP10',msci_korea:'MSCI Korea',krx_semi:'KRX 반도체',fn_semitop10:'FnGuide 반도체TOP10',fn_aitop2:'FnGuide AI반도체TOP2+',fn_aitop2_sol:'AI반도체TOP2플러스(SOL)',fn_ksemi:'FnGuide K-반도체',fn_top5plus:'FnGuide TOP5 Plus',fn_battery:'FnGuide 2차전지산업',fn_defense:'FnGuide K-방위산업',fn_ship:'FnGuide 조선TOP3+',fn_aitop3:'FnGuide AI반도체TOP3+',mkf_samsung:'MKF 삼성그룹',mkf_hyundai:'MKF 현대차그룹+',valueup:'코리아 밸류업',fn_sobujang:'FnGuide AI반도체 소부장',fn_dividend:'FnGuide 배당주',wise_battery:'WISE 2차전지테마',is_power:'iSelect AI전력핵심설비',kedi_power:'KEDI AI전력기기TOP3+',k200s_fin:'코스피200 금융',k200s_enerchem:'코스피200 에너지화학',k200s_ind:'코스피200 산업재',k200s_const:'코스피200 건설',k200s_heavy:'코스피200 중공업',k200s_steel:'코스피200 철강소재',k200s_staples:'코스피200 생활소비재',k200s_discr:'코스피200 경기소비재',k200s_comm:'코스피200 커뮤니케이션서비스',k200s_health:'코스피200 헬스케어'};
const HIDE_PROXY = new Set(['krx_semi_tiger','krx_semi_lev','fn_semitop10_lev','kospi200_it_lev','kosdaq150_lev','kospi200_lev','kospi200_tiger','kosdaq150_tiger']);
function renderSearch(){
  $('#tab-search').innerHTML=`<div class="card"><div class="eyebrow">검색</div><h2>종목별 편입 현황·예측·예정 플로우</h2><div class="row"><input type="text" id="s-q" placeholder="종목명 또는 코드 (예: 대덕전자, 005930)" style="width:320px"></div><p class="sub">보통주별 가격 기준일·현재 유니버스 포함 여부를 함께 확인할 수 있습니다</p><div id="s-res"></div></div>`;
  const draw=()=>{
    const q=($('#s-q').value||'').trim().toLowerCase(); const box=$('#s-res'); if(q.length<1){box.innerHTML='';return;}
    const hits=Object.entries(NAMES).filter(([c,n])=>c.includes(q)||n.toLowerCase().includes(q)).slice(0,8);
    box.innerHTML = hits.map(([c,n])=>{
      const mem=Object.entries(D.members).filter(([k,arr])=>!HIDE_PROXY.has(k)&&arr.includes(c)).map(([k])=>PROXY_LABEL[k]||k);
      const k=A.kospi200.all.find(u=>u.code===c), kq=A.kosdaq150.all.find(u=>u.code===c);
      const t=A.fn_top10.top.find(u=>u.code===c), s=A.fn_semitop10.top.find(u=>u.code===c);
      const ipo=A.ipo_monitor.find(u=>u.code===c), ms=A.msci.candidates.find(u=>u.code===c);
      const fl=D.flows&&D.flows.by_stock[c];
      const line=(lab,u)=>u?`<li><span><span class="n">${lab}</span> <span class="m">${esc(u.sector)} · 순위 ${u.mcap_rank}/${u.n_exist} (${fmt.pct(u.rank_ratio,0)}) · 누적 ${fmt.pct(u.cum_share)} · 유동성 ${u.liq_ok?'충족':'미달'} · 일평균시총 ${fmt.eok(u.avg_mcap)}${u.cur_weight!=null?' · 현비중 '+u.cur_weight+'%':''}</span></span>${statusBadge(u.status)}</li>`:'';
      return `<div class="card" style="margin-top:10px"><h2>${nm(n,c)}</h2>
        <div class="chips" style="margin:6px 0 10px">${mem.length?mem.map(m=>`<span class="badge">${esc(m)}</span>`).join(''):'<span class="muted small">현재 편입 지수 없음(프록시 ETF 기준)</span>'}</div>
        <ul class="list">${line(`코스피200 ${fmt.md(A.kospi200.window.apply)} 예상`,k)}${line(`코스닥150 ${fmt.md(A.kosdaq150.window.apply)} 예상`,kq)}
        ${t?`<li><span><span class="n">FnGuide TOP10</span> <span class="m">유동시총 순위 ${t.rank}위</span></span>${t.rank<=10?(t.is_cur?'<span class="badge ok">유지</span>':'<span class="badge up">신규편입</span>'):(t.is_cur?'<span class="badge dn">편출</span>':'')}${t.excluded?` <span class="badge warn">${esc(t.excluded)}</span>`:''}</li>`:''}
        ${s?`<li><span><span class="n">FnGuide 반도체TOP10</span> <span class="m">순위 ${s.rank}위</span></span>${s.rank<=10?(s.is_cur?'<span class="badge ok">유지</span>':'<span class="badge up">신규편입</span>'):(s.is_cur?'<span class="badge dn">편출</span>':'')}</li>`:''}
        ${ipo?`<li><span><span class="n">신규상장 특례</span> <span class="m">시총 ${ipo.rank}위 (기준 ${ipo.threshold_rank}위)</span></span>${ipo.eligible?'<span class="badge up">요건 충족</span>':''}</li>`:''}
        ${ms?`<li><span><span class="n">MSCI 후보</span> <span class="m">풀시총 USD ${ms.mktcap_usd_bn.toFixed(2)}bn</span></span></li>`:''}</ul>
        ${fl?`<h3>예정 패시브 플로우 <span class="${cls(fl.total)}">${fmt.signed(fl.total)}</span></h3><div class="tbl short"><table><thead><tr><th>적용일</th><th class="l">지수</th><th>예상 순매매</th><th>ADV</th></tr></thead><tbody>${[...fl.events].sort((a,b)=>a.apply.localeCompare(b.apply)).map(ev=>`<tr><td ${sortAttr(ev.apply)}>${esc(fmt.date(ev.apply))}</td><td class="l">${esc(ev.index)}</td><td ${sortAttr(ev.flow)} class="${cls(ev.flow)}">${fmt.signed(ev.flow)}</td><td ${sortAttr(ev.adv_mult)}>${ev.adv_mult!=null?ev.adv_mult.toFixed(1)+'일':'-'}</td></tr>`).join('')}</tbody></table></div>`:''}</div>`;
    }).join('')||'<div class="muted small">검색 결과 없음</div>';
  };
  $('#s-q').oninput=draw;
}
