<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ETF·BM 편출입 트래커</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#111827;--ink2:#374151;--muted:#6b7280;--line:#e5e7eb;--line2:#f0f1f3;--accent:#2457d6;--accent-bg:#eef3ff;
  --up:#d23f45;--up-bg:#fdeeee;--dn:#2b6cd9;--dn-bg:#e8f0fd;--warn:#b7791f;--warn-bg:#fdf3dc;--ok:#1f8a4c;--ok-bg:#e6f5ec;--zebra:#fafbfc}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
b,strong{font-weight:700}
/* header / nav */
.top{background:#fff;border-bottom:1px solid var(--line)}
.top .in{max-width:1320px;margin:0 auto;padding:14px 20px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px}
.brand .tag{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-bg);padding:2px 8px;border-radius:999px}
.meta{color:var(--muted);font-size:12px;padding-bottom:10px}
nav{max-width:1320px;margin:0 auto;padding:6px 12px 0;display:flex;gap:2px 18px;flex-wrap:wrap}
nav .grp{display:flex;align-items:center;gap:2px}
nav .grp .lbl{font-size:10.5px;font-weight:700;color:#9ca3af;letter-spacing:.06em;margin:0 6px 0 4px;text-transform:uppercase}
nav button{border:0;background:transparent;padding:9px 10px 10px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
.sticky{position:sticky;top:0;z-index:10;box-shadow:0 1px 0 var(--line)}
main{max-width:1320px;margin:0 auto;padding:18px 20px 40px}
section.tab{display:none}section.tab.on{display:block}
/* layout */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.stack>*+*{margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card.tight{padding:12px 14px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;color:#9ca3af;text-transform:uppercase;margin:0 0 4px}
.card h2{margin:0 0 4px;font-size:16px;font-weight:800;letter-spacing:-.2px}
.card h3{margin:14px 0 8px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.hd .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* kpi */
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12px;margin-top:4px}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:6px}
/* badges */
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;background:#eef0f3;color:#374151;white-space:nowrap;line-height:1.6}
.badge.up{background:var(--up-bg);color:var(--up)}.badge.dn{background:var(--dn-bg);color:var(--dn)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.acc{background:var(--accent-bg);color:var(--accent)}
.badge.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px 6px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;vertical-align:middle}
th{position:sticky;top:0;background:#f8f9fb;color:#6b7280;font-weight:600;font-size:11.5px;letter-spacing:.01em;z-index:1}
td:first-child,th:first-child,.l{text-align:left}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr:hover td{background:#f1f5fd}
tbody tr.click{cursor:pointer}
td .code{color:#9ca3af;font-size:11px;margin-left:4px}
td.wrap,th.wrap{white-space:normal}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:72vh}
.tbl.short{max-height:400px}.tbl.xs{max-height:260px}
.pos{color:var(--up)}.neg{color:var(--dn)}.muted{color:var(--muted)}.small{font-size:12px}.xs{font-size:11px}
/* controls */
input[type=text],input[type=number],select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:var(--ink)}
input[type=text]:focus,input[type=number]:focus,select:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.toggle{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
/* notes */
details.note{background:#f8f9fb;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--ink2);margin:10px 0 0}
details.note summary{cursor:pointer;font-weight:600;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px}
details.note summary::-webkit-details-marker{display:none}
details.note summary::before{content:"▸";font-size:11px;transition:transform .15s}
details.note[open] summary::before{transform:rotate(90deg)}
details.note .body{margin-top:8px;line-height:1.6}
details.note ul{margin:4px 0 0 18px;padding:0}
.callout{border-left:3px solid var(--accent);background:var(--accent-bg);padding:8px 12px;border-radius:6px;font-size:12.5px;color:var(--ink2)}
/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:82px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.tl li:last-child{border-bottom:0}
.tl .d{font-weight:700;font-size:13px}.tl .dd{font-size:11.5px;color:var(--accent);font-weight:700}
.tl .i{font-weight:700;font-size:13px}.tl .e{color:var(--ink2);font-size:12.5px}.tl .s{color:var(--muted);font-size:11.5px;margin-top:2px}
.tl li.soon .dd{color:var(--up)}
/* kb */
.kb{margin:0}.kb dt{font-weight:700;margin-top:10px;font-size:12.5px;color:var(--ink2)}.kb dd{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
.kb ul{margin:2px 0 0 18px;padding:0}
/* misc */
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:12.5px;align-items:center}
.list li:last-child{border-bottom:0}
.list .n{font-weight:600}.list .m{color:var(--muted);font-size:11.5px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:26px 16px}
@media (max-width:760px){main{padding:12px}th,td{padding:6px 7px}.g2{grid-template-columns:1fr}.kpi .v{font-size:20px}}
</style>
</head>
<body>
<div class="top sticky">
  <div class="in">
    <div class="brand"><h1>ETF·BM 편출입 트래커</h1><span class="tag">공식 방법론 기준</span></div>
    <div class="meta" id="hdr-sub"></div>
  </div>
  <nav id="nav">
    <div class="grp"><span class="lbl">개요</span><button data-t="dash" class="on">대시보드</button><button data-t="cal">일정</button></div>
    <div class="grp"><span class="lbl">플로우</span><button data-t="semi">KRX 반도체 9/11</button><button data-t="flows">전체 리밸 플로우</button></div>
    <div class="grp"><span class="lbl">예측</span><button data-t="k200">코스피 200</button><button data-t="kq150">코스닥 150</button><button data-t="top">KOSPI100·TOP·테마</button></div>
    <div class="grp"><span class="lbl">모니터</span><button data-t="adhoc">수시·특례·MSCI</button></div>
    <div class="grp"><span class="lbl">자료</span><button data-t="etf">ETF·방법론</button><button data-t="search">종목 검색</button></div>
  </nav>
</div>
<main>
  <section class="tab on" id="tab-dash"></section>
  <section class="tab" id="tab-cal"></section>
  <section class="tab" id="tab-semi"></section>
  <section class="tab" id="tab-flows"></section>
  <section class="tab" id="tab-k200"></section>
  <section class="tab" id="tab-kq150"></section>
  <section class="tab" id="tab-top"></section>
  <section class="tab" id="tab-adhoc"></section>
  <section class="tab" id="tab-etf"></section>
  <section class="tab" id="tab-search"></section>
</main>
<footer>데이터: 네이버금융·다음금융·WISE(섹터)·wisereport(ETF PDF) 공개 데이터 · 방법론: KRX·FnGuide·MSCI 공식 문서 · 투자판단 참고자료이며 정확성을 보장하지 않습니다.</footer>
<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const A = D.analysis, KB = D.kb.indexes, EIK = D.kb.etf_index_key;
const $ = s => document.querySelector(s);
const fmt = {
  eok(v){ if(v==null) return '-'; return fmt.eokv(v/1e8); },
  eokv(e){ if(e==null||isNaN(e)) return '-'; const a=Math.abs(e), sgn=e<0?'-':''; if(a>=10000) return sgn+(a/10000).toFixed(a>=100000?0:1)+'조'; return sgn+Math.round(a).toLocaleString()+'억'; },
  signed(e){ if(e==null) return '-'; return (e>0?'+':'')+fmt.eokv(e); },
  pct(v,d=1){ return v==null?'-':(v*100).toFixed(d)+'%'; },
  n(v,d=0){ return v==null?'-':Number(v).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:d}); },
  date(s){ if(!s) return '-'; s=String(s); return s.length===8? `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6)}`: s; },
  md(s){ return s? String(s).slice(5,10).replace('-','/') : '-'; },
};
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls = v => v>0?'pos':v<0?'neg':'';
const statusBadge = s => { if(!s) return ''; const t=esc(s); if(s.startsWith('신규편입')) return `<span class="badge up">${t}</span>`; if(s.startsWith('편출')) return `<span class="badge dn">${t}</span>`; if(s.startsWith('유지')) return `<span class="badge ok">${t}</span>`; if(s.startsWith('산업군제외')||s.startsWith('심사제외')) return `<span class="badge warn">${t}</span>`; return `<span class="badge">${t}</span>`; };
const nm = (name, code) => `${esc(name)}<a class="code" href="https://finance.naver.com/item/main.naver?code=${code}" target="_blank" rel="noopener">${code}</a>`;
const note = (title, html) => `<details class="note"><summary>${esc(title)}</summary><div class="body">${html}</div></details>`;
const NAMES = {};
[...A.kospi200.all, ...A.kosdaq150.all, ...A.fn_top10.top, ...A.fn_semitop10.top, ...A.msci.candidates].forEach(u=>NAMES[u.code]=u.name);
if(D.semi) Object.values(D.semi.scenarios).forEach(sc=>sc.rows.forEach(u=>NAMES[u.code]=u.name));
if(D.flows) Object.entries(D.flows.by_stock).forEach(([c,v])=>NAMES[c]=v.name);

$('#hdr-sub').textContent = `데이터 ${A.generated} 생성 · 시세 ${fmt.date(A.last_daily)} · ETF PDF ${D.proxy.kospi200.date} · USD/KRW ${fmt.n(A.usdkrw,0)}`;

/* ---------- 패시브 플로우 모델 (KOSPI200/KOSDAQ150 탭) ---------- */
function flowModel(idx, aumEok){
  const sel = idx.all.filter(u => u.status && (u.status.startsWith('유지')||u.status.startsWith('신규편입')));
  const fifs = idx.all.filter(u=>u.is_cur && u.fif).map(u=>u.fif).sort((a,b)=>a-b);
  const fifDef = fifs.length? fifs[Math.floor(fifs.length/2)] : 0.6;
  const w = u => (u.mktcap_now||0) * (u.fif || fifDef);
  const tot = sel.reduce((s,u)=>s+w(u),0);
  const wDel = u => (u.cur_weight && u.cur_weight>0)? u.cur_weight/100 : w(u)/tot;
  return { weight:u=> w(u)/tot, weightDel:wDel, flowAdd:u=> aumEok*(w(u)/tot), flowDel:u=> aumEok*wDel(u), advDays:(f,u)=> u.avg_trdval? (f*1e8)/u.avg_trdval : null };
}

/* ---------- 대시보드 ---------- */
function renderDash(){
  const k=A.kospi200, q=A.kosdaq150, t=A.fn_top10, s=A.fn_semitop10;
  const ev = A.events.slice(0,10);
  const next = A.events[0];
  const semiA = D.semi? D.semi.scenarios.current : null;
  const capAlerts = A.cap_monitor.filter(c=>c.top.some(x=>x.over));
  const ipo = A.ipo_monitor.filter(x=>x.eligible);
  let hl=[];
  if(D.flows) D.flows.events.forEach(e=>e.rows.forEach(r=>hl.push({name:r.name,code:r.code,index:e.name,apply:e.apply,flow:r.flow_total,adv:r.adv_mult})));
  if(semiA) semiA.rows.forEach(r=>{ if(r.flow_total) hl.push({name:r.name,code:r.code,index:'KRX 반도체',apply:D.semi.apply,flow:r.flow_total,adv:r.adv_mult}); });
  const buys=hl.filter(x=>x.flow>0).sort((a,b)=>b.flow-a.flow).slice(0,10), sells=hl.filter(x=>x.flow<0).sort((a,b)=>a.flow-b.flow).slice(0,10);
  const hlRow = x=>`<li><span><span class="n">${esc(x.name)}</span> <span class="m">${esc(x.index)} · ${fmt.md(x.apply)}${x.adv!=null?' · ADV '+x.adv.toFixed(1)+'일':''}</span></span><b class="${cls(x.flow)}">${fmt.signed(x.flow)}</b></li>`;
  const chg = arr => arr.length? arr.map(u=>esc(u.name||u)).join(', ') : '<span class="muted">없음</span>';
  $('#tab-dash').innerHTML = `
  <div class="grid g4">
    <div class="card kpi"><div class="eyebrow">다음 이벤트</div><div class="v">D-${next.dday}</div><div class="s"><b>${esc(next.index)}</b><br>${esc(next.event)}</div><div class="l">${next.date}</div></div>
    ${semiA?`<div class="card kpi"><div class="eyebrow">KRX 반도체 · ${fmt.md(D.semi.apply)} 적용</div><div class="v"><span class="neg">${fmt.eokv(semiA.total_sell_eok)}</span> <span class="muted" style="font-size:16px">/</span> <span class="pos">+${fmt.eokv(semiA.total_buy_eok)}</span></div><div class="l">패시브 매도 / 매수 (시나리오 A: 20% CAP 복원)</div></div>`:''}
    <div class="card kpi"><div class="eyebrow">코스피 200 · ${fmt.md(k.window.apply)} 적용</div><div class="v"><span class="pos">${k.adds.length} IN</span> <span class="muted" style="font-size:16px">/</span> <span class="neg">${k.dels.length} OUT</span></div><div class="l">12월 정기변경 예상 · 심사 ${fmt.md(fmt.date(k.window.period_start))}~${fmt.md(fmt.date(k.window.period_end))} 중 ${fmt.md(fmt.date(k.data_through))}까지 집계</div></div>
    <div class="card kpi"><div class="eyebrow">코스닥 150 · ${fmt.md(q.window.apply)} 적용</div><div class="v"><span class="pos">${q.adds.length} IN</span> <span class="muted" style="font-size:16px">/</span> <span class="neg">${q.dels.length} OUT</span></div><div class="l">12월 정기변경 예상</div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="eyebrow">일정</div><h2>다가오는 이벤트</h2><p class="sub">공식 방법론의 날짜 규칙으로 계산 · 전체는 일정 탭</p>
      <ul class="tl">${ev.map(e=>`<li class="${e.dday<=7?'soon':''}"><div><div class="d">${fmt.md(e.date)}</div><div class="dd">D-${e.dday}</div></div><div><div class="i">${esc(e.index)}</div><div class="e">${esc(e.event)}</div><div class="s">${esc(e.etfs)}</div></div></li>`).join('')}</ul></div>
    <div class="card"><div class="eyebrow">예측</div><h2>예상 편출입 한눈에</h2><p class="sub">괄호 안은 산업군 내 시총순위 ÷ 기존 구성종목수</p>
      <div class="tbl" style="max-height:none;border:0"><table><thead><tr><th class="l">지수</th><th>적용</th><th class="l wrap">편입</th><th class="l wrap">편출</th></tr></thead><tbody>
        <tr><td class="l"><b>코스피 200</b></td><td>${fmt.md(k.window.apply)}</td><td class="l wrap">${k.adds.map(u=>`${esc(u.name)} <span class="muted xs">(${fmt.pct(u.rank_ratio,0)})</span>`).join(', ')||'-'}</td><td class="l wrap">${k.dels.map(u=>`${esc(u.name)} <span class="muted xs">(${u.rank_ratio?fmt.pct(u.rank_ratio,0):esc(u.status)})</span>`).join(', ')||'-'}</td></tr>
        <tr><td class="l"><b>코스닥 150</b></td><td>${fmt.md(q.window.apply)}</td><td class="l wrap">${chg(q.adds)}</td><td class="l wrap">${chg(q.dels)}</td></tr>
        <tr><td class="l"><b>KOSPI 100</b></td><td>${fmt.md(k.window.apply)}</td><td class="l wrap">${chg(A.kospi100.adds)}</td><td class="l wrap">${chg(A.kospi100.dels)}</td></tr>
        <tr><td class="l"><b>FnGuide TOP10</b></td><td>09/14</td><td class="l wrap">${chg(t.adds)}</td><td class="l wrap">${chg(t.dels)}</td></tr>
        <tr><td class="l"><b>반도체 TOP10</b></td><td>10/12</td><td class="l wrap">${chg(s.adds)}</td><td class="l wrap">${chg(s.dels)}</td></tr>
        ${D.semi?`<tr><td class="l"><b>KRX 반도체</b> <span class="muted xs">시나리오 B</span></td><td>${fmt.md(D.semi.apply)}</td><td class="l wrap">${chg(D.semi.scenarios.cap10.adds.map(c=>NAMES[c]||c))}</td><td class="l wrap">${chg(D.semi.scenarios.cap10.dels.map(c=>NAMES[c]||c))}</td></tr>`:''}
      </tbody></table></div>
      <div class="row" style="margin-top:10px"><span class="badge ${capAlerts.length?'warn':'ok'}">캡 트리거 초과 ${capAlerts.length}</span><span class="badge ${ipo.length?'up':'ghost'}">특례편입 요건 충족 ${ipo.length}</span><span class="badge ghost">MSCI 11/11 발표</span></div>
    </div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="eyebrow">플로우 하이라이트</div><h2>패시브 매수 상위</h2><p class="sub">남은 정기변경 전체 · 종목·이벤트 단위</p><ul class="list">${buys.map(hlRow).join('')}</ul></div>
    <div class="card"><div class="eyebrow">플로우 하이라이트</div><h2>패시브 매도 상위</h2><p class="sub">KRX 반도체는 시나리오 A 기준</p><ul class="list">${sells.map(hlRow).join('')}</ul></div>
  </div>`;
}

/* ---------- 일정 ---------- */
function renderCal(){
  $('#tab-cal').innerHTML = `<div class="card"><div class="hd"><div><div class="eyebrow">일정</div><h2>지수 이벤트 캘린더</h2><p class="sub">선물 최종거래일(둘째 목요일)·심사기준일(전전월 말) 등 공식 규칙을 KRX 휴장일에 맞춰 계산 · MSCI는 공식 발표 일정</p></div>
    <div class="r"><div class="seg" id="cal-kind"><button data-v="" class="on">전체</button><button data-v="정기">정기변경</button><button data-v="수시">수시</button></div><input type="text" id="cal-q" placeholder="지수·ETF 검색"></div></div>
    <div class="tbl" id="cal-tbl"></div></div>`;
  let kind='';
  const draw = ()=>{
    const q=($('#cal-q').value||'').toLowerCase();
    const rows = A.events.filter(e=>(!kind||e.kind===kind)&&(!q||(e.index+e.etfs+e.event).toLowerCase().includes(q)));
    $('#cal-tbl').innerHTML = `<table><thead><tr><th class="l">일자</th><th>D-day</th><th class="l">지수</th><th class="l">이벤트</th><th class="l">관련 ETF</th><th class="l">근거</th></tr></thead><tbody>${rows.map(e=>`<tr><td><b>${e.date}</b></td><td class="${e.dday<=7?'pos':''}"><b>D-${e.dday}</b></td><td class="l"><b>${esc(e.index)}</b></td><td class="l wrap">${esc(e.event)}</td><td class="l wrap muted">${esc(e.etfs)}</td><td class="l wrap muted xs">${esc(e.source)}</td></tr>`).join('')}</tbody></table>`;
  };
  document.querySelectorAll('#cal-kind button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#cal-kind button').forEach(x=>x.classList.toggle('on',x===b));kind=b.dataset.v;draw();});
  $('#cal-q').oninput=draw; draw();
}

/* ---------- KRX 반도체 ---------- */
function renderSemi(){
  const S=D.semi; const wrap=$('#tab-semi'); if(!S){wrap.innerHTML='<div class="card">데이터 없음</div>';return;}
  const keys=Object.keys(S.scenarios); const short={current:'A · 편출입 없음',cap10:'B · 커버리지 CAP 10%',literal:'C · 방법론 문언'};
  wrap.innerHTML=`<div class="card"><div class="hd"><div><div class="eyebrow">플로우 · KRX 섹터지수 정기변경</div><h2>KRX 반도체 — 종목별 패시브 매수/매도 추정</h2>
      <p class="sub">${S.expiry} 선물만기 → <b>${S.apply} 적용</b> (${fmt.md(S.expiry)} 종가 리밸런싱) · 심사기준일 ${fmt.date(S.ref_date)} · 심사기간 ${fmt.date(S.period[0])}~${fmt.date(S.period[1])} · 현행 ${S.n_current}종목 (KODEX 반도체 PDF ${S.pdf_date}) · 시세 ${fmt.date(S.data_through)}</p></div>
      <div class="r"><div class="seg" id="semi-sc">${keys.map((k,i)=>`<button data-v="${k}" class="${i===0?'on':''}">${esc(short[k]||k)}</button>`).join('')}</div></div></div>
    <div class="callout" id="semi-desc"></div>
    <div id="semi-sum" style="margin-top:12px"></div>
    ${note('공식 근거·계산 방법·가정', `<b>공식 근거</b>: ${esc(S.rules)}<ul>${S.krx_notices.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>
      <b>계산</b>: 목표비중 = 유동시총(현재 시총 × 추정 FIF) 비례 가중 후 20% CAP(초과분 비례 재배분) · 현재비중 = 각 ETF PDF 비중을 최근 종가로 드리프트 보정 · 매매금액 = Σ ETF 명목 × (목표 − 현재) · ADV배수 = |매매금액| ÷ 최근 20일 평균 거래대금. FIF는 KODEX 반도체 비중/시총 역산(상위 10분위=1.0), 대형 상한종목·신규는 KODEX200 역산 또는 중앙값. 지수 실제 유동비율은 반영하지 못하므로 소형주 수치는 오차가 큽니다.<br>
      <b>GICS 분류 제외(추정)</b><ul>${Object.entries(S.gics_excluded).map(([c,v])=>`<li>${esc(NAMES[c]||c)} — ${esc(v)}</li>`).join('')}</ul>`)}
  </div>
  <div class="card" style="margin-top:14px"><div class="hd"><div><div class="eyebrow">종목별</div><h2>추정 매매 (|순매매| 순)</h2></div><div class="r"><label class="toggle"><input type="checkbox" id="semi-all"> 심사대상 전체 표시</label></div></div><div class="tbl" id="semi-tbl"></div></div>`;
  let cur=keys[0];
  const draw=()=>{
    const sc=S.scenarios[cur]; const all=$('#semi-all').checked;
    $('#semi-desc').innerHTML=esc(S.scenario_desc[cur]);
    const adds=sc.rows.filter(u=>u.status.startsWith('신규편입')), dels=sc.rows.filter(u=>u.status.startsWith('편출'));
    $('#semi-sum').innerHTML=`<div class="grid g4">
      <div class="card tight kpi"><div class="l">총 매수 (추정)</div><div class="v pos">+${fmt.eokv(sc.total_buy_eok)}</div></div>
      <div class="card tight kpi"><div class="l">총 매도 (추정)</div><div class="v neg">${fmt.eokv(sc.total_sell_eok)}</div></div>
      <div class="card tight kpi"><div class="l">선정 종목수 / 심사대상</div><div class="v">${sc.n_selected} <span class="muted" style="font-size:14px">/ ${sc.n_eligible}</span></div><div class="s">20% CAP: ${sc.capped.map(c=>esc(NAMES[c]||c)).join(' · ')}</div></div>
      <div class="card tight kpi"><div class="l">편입 / 편출</div><div class="v"><span class="pos">${adds.length}</span> <span class="muted" style="font-size:14px">/</span> <span class="neg">${dels.length}</span></div><div class="s">${adds.map(u=>esc(u.name)).join(', ')||'-'}<br>${dels.map(u=>esc(u.name)).join(', ')||'-'}</div></div></div>
      <div class="tbl" style="margin-top:12px;max-height:none"><table><thead><tr><th class="l">추종 ETF</th><th>순자산</th><th>적용 명목</th><th class="l">비고</th></tr></thead><tbody>${sc.etfs.map(e=>`<tr><td class="l">${esc(e.name)}<span class="code">${e.code}</span></td><td>${fmt.eokv(e.aum_eok)}</td><td><b>${fmt.eokv(e.notional_eok)}</b></td><td class="l wrap muted xs">${esc(e.note)}</td></tr>`).join('')}</tbody></table></div>`;
    const rows=sc.rows.filter(u=>all || u.is_cur || u.status.startsWith('신규편입'));
    const etfCodes=sc.etfs.map(e=>e.code);
    $('#semi-tbl').innerHTML=`<table><thead><tr><th class="l">종목</th><th class="l">상태</th><th>현재</th><th>목표</th><th>Δ</th>${etfCodes.map(c=>`<th>${esc(sc.etfs.find(e=>e.code===c).name.replace(/^(KODEX|TIGER) /,''))}</th>`).join('')}<th>순매매</th><th>ADV</th><th>5~7월 평균시총</th><th>순위</th><th>누적</th><th>유동성</th><th>FIF</th></tr></thead><tbody>${rows.map(u=>`<tr><td class="l">${nm(u.name,u.code)}</td><td class="l">${statusBadge(u.status)}${u.capped?' <span class="badge warn">CAP</span>':''}</td><td>${(u.w_cur_adj||0).toFixed(2)}%</td><td>${(u.w_target||0).toFixed(2)}%</td><td class="${cls(u.delta)}">${u.delta>0?'+':''}${(u.delta||0).toFixed(2)}%p</td>${etfCodes.map(c=>{const f=(u.flow_by_etf||{})[c]||0;return `<td class="${cls(f)}">${f?fmt.eokv(f):'-'}</td>`;}).join('')}<td class="${cls(u.flow_total)}"><b>${u.flow_total?fmt.signed(u.flow_total):'-'}</b></td><td>${u.adv_mult!=null?u.adv_mult.toFixed(1)+'일':'-'}</td><td>${fmt.eok(u.avg_mcap)}</td><td>${u.mcap_rank??'-'}</td><td>${fmt.pct(u.cum_share)}</td><td>${u.liq_ok===false?'<span class="badge dn">미달</span>':u.liq_ok?'<span class="badge ok">충족</span>':'-'}</td><td>${u.fif?u.fif.toFixed(2):'-'}</td></tr>`).join('')}</tbody></table>`;
  };
  document.querySelectorAll('#semi-sc button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#semi-sc button').forEach(x=>x.classList.toggle('on',x===b));cur=b.dataset.v;draw();});
  $('#semi-all').onchange=draw; draw();
}

/* ---------- 전체 정기변경 플로우 ---------- */
function wdesc(w){ if(!w) return '-'; if(w.type==='float') return `유동시총 가중${w.cap?` · ${Math.round(w.cap*100)}% 실링`:''}`; if(w.type==='topn_fixed') return `상위 ${w.n}종목 각 ${Math.round(w.w*100)}% 고정 + 나머지 ${{float:'유동시총 가중',equal:'균등',current:'현재비중 비례'}[w.rest]||w.rest}${w.cap?` (${Math.round(w.cap*100)}% 실링)`:''}`; if(w.type==='score_tiered') return `스코어 가중 · 1위 ${Math.round(w.first*100)}% / 그외 ${Math.round(w.others*100)}% 실링`; return JSON.stringify(w); }
function renderFlows(){
  const F=D.flows; const wrap=$('#tab-flows'); if(!F){wrap.innerHTML='<div class="card">데이터 없음</div>';return;}
  const evs=[...F.events].sort((a,b)=>a.apply.localeCompare(b.apply));
  const byStock=Object.entries(F.by_stock).map(([c,v])=>({code:c,...v})).sort((a,b)=>Math.abs(b.total)-Math.abs(a.total));
  wrap.innerHTML=`<div class="card"><div class="eyebrow">플로우</div><h2>남은 정기변경 — 지수별 패시브 매수/매도 추정</h2><p class="sub">적용일 순 · 행을 클릭하면 종목별 상세 · KRX 반도체(9/11)는 별도 탭</p>
    <div class="tbl short"><table><thead><tr><th class="l">적용일</th><th class="l">지수</th><th>추종 명목</th><th>편입</th><th>편출</th><th>총매수</th><th>총매도</th><th class="l">최대 매수</th><th class="l">최대 매도</th></tr></thead><tbody>${evs.map(e=>{const b=e.rows.filter(r=>r.flow_total>0).slice(0,3), s_=e.rows.filter(r=>r.flow_total<0).slice(0,3);return `<tr class="click" data-k="${e.key}"><td><b>${esc(e.apply.slice(0,10))}</b>${e.apply.length>10?`<div class="muted xs">${esc(e.apply.slice(10).trim())}</div>`:''}</td><td class="l"><b>${esc(e.name)}</b></td><td>${fmt.eokv(e.notional_total)}</td><td>${e.adds.length||'<span class="muted">-</span>'}</td><td>${e.dels.length||'<span class="muted">-</span>'}</td><td class="pos">+${fmt.eokv(e.total_buy)}</td><td class="neg">${fmt.eokv(e.total_sell)}</td><td class="l xs wrap">${b.map(r=>`${esc(r.name)} <span class="pos">+${fmt.eokv(r.flow_total)}</span>`).join(' · ')}</td><td class="l xs wrap">${s_.map(r=>`${esc(r.name)} <span class="neg">${fmt.eokv(r.flow_total)}</span>`).join(' · ')}</td></tr>`;}).join('')}</tbody></table></div>
    ${note('계산 방법·가정', `각 지수의 <b>공식 가중·캡 규칙</b>으로 목표비중을 만들고, 프록시 ETF PDF 비중(최근 종가로 드리프트 보정)과의 차이에 추종 ETF 명목(레버리지는 2배에서 기초ETF 실물 보유분 중복 차감)을 곱했습니다. 종목 선정 로직을 재현할 수 있는 지수(KOSPI200·KOSDAQ150·KOSPI100·코스피200 IT·FnGuide TOP10·반도체TOP10)는 편출입 예측을 반영했고, 키워드/스코어 선정 지수는 <b>구성종목 불변 가정</b>으로 비중·캡 재설정 효과만 계산했습니다. 유지 종목의 소액 Δ는 유동비율 추정 오차가 섞여 있으니 편입·편출과 캡 재설정에 의한 큰 금액 위주로 보세요.`)}
  </div>
  <div id="flow-detail" style="margin-top:14px"></div>
  <div class="card" style="margin-top:14px"><div class="hd"><div><div class="eyebrow">종목별 합산</div><h2>남은 이벤트 전체 수급 합계</h2><p class="sub">KRX 반도체 시나리오 A 포함 · 같은 종목의 반대 방향 플로우는 상쇄되어 표시</p></div><div class="r"><input type="text" id="flow-q" placeholder="종목명·코드"><label class="toggle"><input type="checkbox" id="flow-abs" checked> |합계| 순</label></div></div><div class="tbl" id="flow-stock"></div></div>`;
  const showEv=(k, scroll)=>{
    const e=evs.find(x=>x.key===k); if(!e) return;
    document.querySelectorAll('#tab-flows tr[data-k]').forEach(tr=>tr.style.outline = tr.dataset.k===k? '2px solid var(--accent)':'' );
    $('#flow-detail').innerHTML=`<div class="card"><div class="eyebrow">상세</div><h2>${esc(e.name)} <span class="muted" style="font-weight:500;font-size:13px">적용 ${esc(e.apply)} · 비중 확정 ${esc(e.fix||'-')} · 프록시 ${e.proxy_etf} PDF ${e.pdf_date}</span></h2>
      <div class="row"><span class="badge up">편입 ${e.adds.length}</span>${e.adds.map(x=>`<span class="badge ghost">${esc(x)}</span>`).join('')}<span class="badge dn" style="margin-left:8px">편출 ${e.dels.length}</span>${e.dels.map(x=>`<span class="badge ghost">${esc(x)}</span>`).join('')}</div>
      <div class="grid g2" style="margin:8px 0 10px"><div class="tbl" style="max-height:none"><table><thead><tr><th class="l">추종 ETF</th><th>순자산</th><th>적용 명목</th></tr></thead><tbody>${e.etfs.map(x=>`<tr><td class="l">${esc(x.name)}<span class="code">${x.code}</span><div class="muted xs" style="white-space:normal">${esc(x.note)}</div></td><td>${fmt.eokv(x.aum_eok)}</td><td><b>${fmt.eokv(x.notional_eok)}</b></td></tr>`).join('')}</tbody></table></div>
        <div class="callout"><b>목표 구성</b>: ${esc(e.target_src)}<br><b>가중</b>: ${esc(wdesc(e.weighting))}<br><span class="muted">${esc(e.note||'')}</span></div></div>
      <div class="tbl"><table><thead><tr><th class="l">종목</th><th class="l">상태</th><th>현재</th><th>목표</th><th>Δ</th>${e.etfs.length>1?e.etfs.map(x=>`<th>${esc(x.name.replace(/^(KODEX|TIGER|RISE|ACE|SOL|PLUS|HANARO|KIWOOM|TIME) /,''))}</th>`).join(''):''}<th>순매매</th><th>ADV</th><th>FIF</th></tr></thead><tbody>${e.rows.map(r=>`<tr><td class="l">${nm(r.name,r.code)}</td><td class="l">${statusBadge(r.status)}${r.fixed?' <span class="badge acc">고정</span>':''}${r.capped?' <span class="badge warn">CAP</span>':''}</td><td>${r.w_cur.toFixed(2)}%</td><td>${r.w_target.toFixed(2)}%</td><td class="${cls(r.delta)}">${r.delta>0?'+':''}${r.delta.toFixed(2)}%p</td>${e.etfs.length>1?e.etfs.map(x=>{const f=(r.flow_by_etf||{})[x.code]||0;return `<td class="${cls(f)}">${f?fmt.eokv(f):'-'}</td>`;}).join(''):''}<td class="${cls(r.flow_total)}"><b>${r.flow_total?fmt.signed(r.flow_total):'-'}</b></td><td>${r.adv_mult!=null?r.adv_mult.toFixed(1)+'일':'-'}</td><td title="${esc(r.fif_src)}">${r.fif.toFixed(2)}</td></tr>`).join('')}</tbody></table></div></div>`;
    if(scroll) $('#flow-detail').scrollIntoView({behavior:'smooth',block:'start'});
  };
  document.querySelectorAll('#tab-flows tr[data-k]').forEach(tr=>tr.onclick=()=>showEv(tr.dataset.k,true));
  const drawStock=()=>{
    const q=($('#flow-q').value||'').toLowerCase();
    let rows=byStock.filter(x=>!q||(x.name+x.code).toLowerCase().includes(q));
    if(!$('#flow-abs').checked) rows=[...rows].sort((a,b)=>b.total-a.total);
    $('#flow-stock').innerHTML=`<table><thead><tr><th class="l">종목</th><th>합계</th><th>건수</th><th class="l">이벤트별 (적용일 · 지수 · 금액 · ADV)</th></tr></thead><tbody>${rows.slice(0,300).map(x=>`<tr><td class="l">${nm(x.name,x.code)}</td><td class="${cls(x.total)}"><b>${fmt.signed(x.total)}</b></td><td>${x.events.length}</td><td class="l wrap"><div class="chips">${x.events.sort((a,b)=>a.apply.localeCompare(b.apply)).map(ev=>`<span class="badge ${ev.flow>0?'up':ev.flow<0?'dn':''}">${esc(fmt.md(ev.apply))} ${esc(ev.index)} ${fmt.signed(ev.flow)}${ev.adv_mult!=null?' · '+ev.adv_mult.toFixed(1)+'일':''}</span>`).join('')}</div></td></tr>`).join('')}</tbody></table>`;
  };
  $('#flow-q').oninput=drawStock; $('#flow-abs').onchange=drawStock; drawStock();
  if(evs.length) showEv(evs[0].key,false);
}

/* ---------- KRX 대표지수 (K200 / KQ150) ---------- */
function renderKrx(key, mount){
  const idx = A[key]; const aumDef = Math.round((A.tracking_aum[key]?.total_eok||0)/1000)/10;
  const kb = KB[key];
  mount.innerHTML = `
  <div class="card"><div class="hd"><div><div class="eyebrow">예측 · 12월 정기변경</div><h2>${esc(idx.name)} 시뮬레이션</h2>
      <p class="sub">심사기준일 <b>${fmt.date(idx.window.ref_date)}</b> · 심사기간 ${fmt.date(idx.window.period_start)}~${fmt.date(idx.window.period_end)} 중 <b>${fmt.date(idx.data_through)}까지 집계</b> · 적용 <b>${idx.window.apply}</b> (선물만기 ${idx.window.expiry} 익영업일) · 결과 공표 ${idx.window.announce.slice(0,7)} · 현 구성 ${idx.n_current} · 심사대상 ${idx.n_universe}</p></div>
      <div class="r"><label class="small muted">추종자금(조원)</label><input type="number" id="${key}-aum" value="${aumDef}" step="0.5" style="width:90px"></div></div>
    <div id="${key}-tables"></div>
    ${note('규칙·추종자금 가정', `${esc(idx.rules)}.<br><b>추종자금</b>: 입력값 × 예상 비중 = 패시브 매수/매도 추정액. 기본값은 해당 지수 추종 국내 ETF 순자산 합계 ${fmt.eokv(A.tracking_aum[key]?.total_eok)} (${A.tracking_aum[key]?.etfs.length}개, 레버리지·커버드콜 포함)이며 연기금·인덱스펀드는 제외이므로 실제 총 추종자금은 이보다 큽니다. 유동비율은 추정 FIF(중앙값 대체) 적용.`)}
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="eyebrow">경계</div><h2>유지 경계 종목</h2><p class="sub">순위비율 ≥ 90% · 편출 위험 순</p><div class="tbl short">${krxTable(idx.watch_keep, null, false)}</div></div>
    <div class="card"><div class="eyebrow">경계</div><h2>편입 경계 종목</h2><p class="sub">미선정 중 기준 근접 순</p><div class="tbl short">${krxTable(idx.watch_new, null, false)}</div></div>

function krxTable(rows, fm, isAdd){
  const flowCol = fm? `<th>예상비중</th><th>패시브 ${isAdd?'매수':'매도'}</th><th>ADV</th>`:'';
  return `<table><thead><tr><th class="l">종목</th><th class="l">산업군</th><th>일평균시총</th><th>거래대금</th><th>순위/기존</th><th>순위비율</th><th>누적</th><th>유동성</th><th class="l">상태</th>${flowCol}<th>현비중</th></tr></thead><tbody>${rows.map(u=>{
    let fc='';
    if(fm){ const flow = isAdd? fm.flowAdd(u) : fm.flowDel(u); const w = isAdd? fm.weight(u) : fm.weightDel(u); const adv = fm.advDays(flow,u); fc=`<td>${fmt.pct(w,2)}</td><td class="${isAdd?'pos':'neg'}"><b>${fmt.eokv(flow)}</b></td><td>${adv==null?'-':adv.toFixed(1)+'일'}</td>`; }
    return `<tr><td class="l">${nm(u.name,u.code)}</td><td class="l">${esc(u.sector||'')}${u.sector_src==='WICS'?'<span class="code">WICS</span>':u.sector_src==='수동보정'?'<span class="code">보정</span>':''}</td><td>${fmt.eok(u.avg_mcap)}</td><td>${fmt.eok(u.avg_trdval)}</td><td>${u.mcap_rank??'-'}/${u.n_exist??'-'}</td><td class="${u.rank_ratio>1?'neg':''}">${fmt.pct(u.rank_ratio,0)}</td><td>${fmt.pct(u.cum_share,1)}</td><td>${u.liq_ok===false?'<span class="badge dn">미달</span>':u.liq_ok?'<span class="badge ok">충족</span>':'-'}</td><td class="l">${statusBadge(u.status)}${u.note?`<div class="muted xs">${esc(u.note)}</div>`:''}</td>${fc}<td>${u.cur_weight!=null?u.cur_weight+'%':'-'}</td></tr>`;}).join('')}</tbody></table>`;
}

  $('#etf-detail').innerHTML = `<div class="card"><div class="eyebrow">상세</div><h2>${esc(e.name)} <span class="muted" style="font-weight:500;font-size:13px">${e.code} · 순자산 ${fmt.eokv(e.aum_eok)} · NAV ${fmt.n(e.nav)}</span></h2>
    <div class="grid g2"><div><dl class="kb"><dt>기초지수</dt><dd>${esc(e.bm)} (${esc(e.provider)})</dd><dt>정기변경</dt><dd>${esc(e.cycle)} — ${esc(e.apply_rule)}</dd><dt>캡</dt><dd>${esc(e.cap)} / ${esc(e.cap_type)}</dd><dt>캡 점검·수시</dt><dd>${esc(e.cap_check)}</dd><dt>정보 신뢰도</dt><dd>${esc(e.confidence)}</dd></dl></div>
    <div>${kb?`<dl class="kb"><dt>공식 방법론 — ${esc(kb.name)}</dt><dd class="muted xs">${esc(kb.doc)} ${kb.doc_url?`· <a href="${kb.doc_url}" target="_blank" rel="noopener">원문 →</a>`:''}</dd><dt>유니버스</dt><dd>${esc(kb.universe)}</dd>${kb.sector?`<dt>산업군</dt><dd>${esc(kb.sector)}</dd>`:''}${kb.criteria?`<dt>심사기준/선정일</dt><dd>${esc(kb.criteria)}</dd>`:''}<dt>선정</dt><dd><ul>${(kb.selection||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></dd><dt>정기변경</dt><dd>${esc(kb.regular)}</dd><dt>수시변경</dt><dd><ul>${(kb.adhoc||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></dd><dt>가중/캡</dt><dd>${esc(kb.cap)}</dd>${kb.notes?`<dt>비고</dt><dd>${esc(kb.notes)}</dd>`:''}</dl>${members?`<p class="muted xs">프록시 ETF 구성종목 ${members}개 (${D.proxy[key]?.date})</p>`:''}`:'<div class="callout">이 지수는 아직 정량 분석 대상이 아닙니다(해외지수·소규모 산출기관). 왼쪽 마스터 정보(투자설명서·방법론 조사)를 참고하세요.</div>'}</div></div>
  </div>`;
  $('#etf-detail').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- 종목 검색 ---------- */
const PROXY_LABEL = {kospi200:'KOSPI 200',kosdaq150:'KOSDAQ 150',kospi100:'KOSPI 100',kospi:'코스피(전종목)',kospi200_it:'코스피200 정보기술',fn_top10:'FnGuide TOP10',msci_korea:'MSCI Korea',krx_semi:'KRX 반도체',fn_semitop10:'FnGuide 반도체TOP10',fn_aitop2:'FnGuide AI반도체TOP2+',fn_aitop2_sol:'AI반도체TOP2플러스(SOL)',fn_ksemi:'FnGuide K-반도체',fn_top5plus:'FnGuide TOP5 Plus',fn_battery:'FnGuide 2차전지산업',fn_defense:'FnGuide K-방위산업',fn_ship:'FnGuide 조선TOP3+',fn_aitop3:'FnGuide AI반도체TOP3+',mkf_samsung:'MKF 삼성그룹',mkf_hyundai:'MKF 현대차그룹+',valueup:'코리아 밸류업',fn_sobujang:'FnGuide AI반도체 소부장',fn_dividend:'FnGuide 배당주',wise_battery:'WISE 2차전지테마',is_power:'iSelect AI전력핵심설비',kedi_power:'KEDI AI전력기기TOP3+',k200s_fin:'코스피200 금융',k200s_enerchem:'코스피200 에너지화학',k200s_ind:'코스피200 산업재',k200s_const:'코스피200 건설',k200s_heavy:'코스피200 중공업',k200s_steel:'코스피200 철강소재',k200s_staples:'코스피200 생활소비재',k200s_discr:'코스피200 경기소비재',k200s_comm:'코스피200 커뮤니케이션서비스',k200s_health:'코스피200 헬스케어'};
const HIDE_PROXY = new Set(['krx_semi_tiger','krx_semi_lev','fn_semitop10_lev','kospi200_it_lev','kosdaq150_lev','kospi200_lev','kospi200_tiger','kosdaq150_tiger']);
function renderSearch(){
  $('#tab-search').innerHTML=`<div class="card"><div class="eyebrow">검색</div><h2>종목별 편입 현황·예측·예정 플로우</h2><div class="row"><input type="text" id="s-q" placeholder="종목명 또는 코드 (예: 대덕전자, 005930)" style="width:320px"></div><p class="sub">심사대상 유니버스(코스피·코스닥 보통주) 내 종목만 검색됩니다</p><div id="s-res"></div></div>`;
  const draw=()=>{
    const q=($('#s-q').value||'').trim().toLowerCase(); const box=$('#s-res'); if(q.length<1){box.innerHTML='';return;}
    const hits=Object.entries(NAMES).filter(([c,n])=>c.includes(q)||n.toLowerCase().includes(q)).slice(0,8);
    box.innerHTML = hits.map(([c,n])=>{
      const mem=Object.entries(D.members).filter(([k,arr])=>!HIDE_PROXY.has(k)&&arr.includes(c)).map(([k])=>PROXY_LABEL[k]||k);
      const k=A.kospi200.all.find(u=>u.code===c), kq=A.kosdaq150.all.find(u=>u.code===c);
      const t=A.fn_top10.top.find(u=>u.code===c), s=A.fn_semitop10.top.find(u=>u.code===c);
      const ipo=A.ipo_monitor.find(u=>u.code===c), ms=A.msci.candidates.find(u=>u.code===c);
      const fl=D.flows&&D.flows.by_stock[c];
      const line=(lab,u)=>u?`<li><span><span class="n">${lab}</span> <span class="m">${esc(u.sector)} · 순위 ${u.mcap_rank}/${u.n_exist} (${fmt.pct(u.rank_ratio,0)}) · 누적 ${fmt.pct(u.cum_share)} · 유동성 ${u.liq_ok?'충족':'미달'} · 일평균시총 ${fmt.eok(u.avg_mcap)}${u.cur_weight!=null?' · 현비중 '+u.cur_weight+'%':''}</span></span>${statusBadge(u.status)}</li>`:'';
      return `<div class="card" style="margin-top:10px"><h2>${nm(n,c)}</h2>
        <div class="chips" style="margin:6px 0 10px">${mem.length?mem.map(m=>`<span class="badge">${esc(m)}</span>`).join(''):'<span class="muted small">현재 편입 지수 없음(프록시 ETF 기준)</span>'}</div>
        <ul class="list">${line('코스피200 12월 시뮬레이션',k)}${line('코스닥150 12월 시뮬레이션',kq)}
        ${t?`<li><span><span class="n">FnGuide TOP10</span> <span class="m">유동시총 순위 ${t.rank}위</span></span>${t.rank<=10?(t.is_cur?'<span class="badge ok">유지</span>':'<span class="badge up">신규편입</span>'):(t.is_cur?'<span class="badge dn">편출</span>':'')}${t.excluded?` <span class="badge warn">${esc(t.excluded)}</span>`:''}</li>`:''}
        ${s?`<li><span><span class="n">FnGuide 반도체TOP10</span> <span class="m">순위 ${s.rank}위</span></span>${s.rank<=10?(s.is_cur?'<span class="badge ok">유지</span>':'<span class="badge up">신규편입</span>'):(s.is_cur?'<span class="badge dn">편출</span>':'')}</li>`:''}
        ${ipo?`<li><span><span class="n">신규상장 특례</span> <span class="m">시총 ${ipo.rank}위 (기준 ${ipo.threshold_rank}위)</span></span>${ipo.eligible?'<span class="badge up">요건 충족</span>':''}</li>`:''}
        ${ms?`<li><span><span class="n">MSCI 후보</span> <span class="m">풀시총 USD ${ms.mktcap_usd_bn.toFixed(2)}bn</span></span></li>`:''}</ul>
        ${fl?`<h3>예정 패시브 플로우 <span class="${cls(fl.total)}">${fmt.signed(fl.total)}</span></h3><div class="chips">${fl.events.sort((a,b)=>a.apply.localeCompare(b.apply)).map(ev=>`<span class="badge ${ev.flow>0?'up':ev.flow<0?'dn':''}">${esc(fmt.md(ev.apply))} ${esc(ev.index)} ${fmt.signed(ev.flow)}${ev.adv_mult!=null?' · '+ev.adv_mult.toFixed(1)+'일':''}</span>`).join('')}</div>`:''}</div>`;
    }).join('')||'<div class="muted small">검색 결과 없음</div>';
  };
  $('#s-q').oninput=draw;
}

/* ---------- tabs ---------- */
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('section.tab').forEach(s=>s.classList.toggle('on',s.id==='tab-'+b.dataset.t));history.replaceState(null,'','#'+b.dataset.t);window.scrollTo({top:0});});
renderDash(); renderCal(); renderSemi(); renderFlows(); renderKrx('kospi200',$('#tab-k200')); renderKrx('kosdaq150',$('#tab-kq150')); renderTop(); renderAdhoc(); renderEtf(); renderSearch();
if(location.hash){const b=document.querySelector(`#nav button[data-t="${location.hash.slice(1)}"]`); if(b) b.click();}
</script>
